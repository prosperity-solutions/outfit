# GoReleaser builds, archives, checksums and signs; publishing is done by
# scripts/release/publish.sh (draft first, verified upload, then publish), so every
# run is `goreleaser release --clean --skip=publish`. See docs/release.md.
version: 2
project_name: outfit

builds:
  - id: outfit
    main: ./cmd/outfit
    binary: outfit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# One macOS binary that runs natively on both Apple Silicon and Intel.
#
# It is signed (and notarized) by a post hook, with the native `codesign` on a macOS
# runner: scripts/release/macos-sign.sh. Without MACOS_SIGN_P12 the hook leaves it
# unsigned. quill (GoReleaser's `notarize.macos`) was tried first and rejected: its
# signature on a Developer ID certificate makes macOS kill the binary on launch
# (docs/macos-signing.md, "Why not quill").
universal_binaries:
  - id: outfit-darwin
    ids: [outfit]
    replace: true
    name_template: outfit
    hooks:
      post:
        - cmd: scripts/release/macos-sign.sh {{ .Path }}
          output: true

archives:
  - id: outfit
    formats: [tar.gz]
    # outfit_<version>_<os>_<arch>.tar.gz, with arch "all" for the macOS universal binary.
    name_template: "outfit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # With the binary, exactly these are what install.sh (`check_archive`) accepts:
    # change both together. `outfit update` (internal/update.ExtractBinary) is lenient
    # about extra plain files on purpose: every INSTALLED copy of it is frozen, so a new
    # file here must not break their updates. It does need a plain `outfit` and refuses
    # links, directories and paths. scripts/ci/signing-smoke.sh feeds a snapshot
    # archive through both checks on every PR.
    files: [LICENSE, README.md, NOTICE]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# The update key lives in the repository variable MINISIGN_PUBLIC_KEY and is
# compiled in from internal/update/keys.txt. The secret key and password are repo
# secrets; release.yml writes the key to a 0600 temp file, exports its path as
# MINISIGN_KEY_FILE and deletes it afterwards. aead.dev/minisign reads the password
# from stdin when it is not a terminal, as one line (hence the \n: without it the
# prompt reads EOF and signing fails).
signs:
  - id: checksums
    cmd: minisign
    stdin: "{{ .Env.MINISIGN_PASSWORD }}\n"
    args: ["-S", "-s", "{{ .Env.MINISIGN_KEY_FILE }}", "-m", "${artifact}", "-x", "${signature}"]
    artifacts: checksum
    signature: "${artifact}.minisig"

# From git, not the API, so the build job needs no token. The notes land in
# dist/CHANGELOG.md and become the release body.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^chore: bootstrap"
