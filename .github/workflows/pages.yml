# Publishes site/ (plain HTML, CSS and one tiny script) to GitHub Pages whenever it changes on main.
# Nothing is built: the folder is the site. Docs: docs/website.md.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

# One deploy at a time; a running one is let finish, never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # publish the artifact
      id-token: write # prove to Pages that this run is the one publishing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
