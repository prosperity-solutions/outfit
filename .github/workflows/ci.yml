name: CI

# Draft PRs run nothing: every job below carries a draft guard, and
# `ready_for_review` is in the trigger types so flipping a draft to ready fires
# the run. `python3 tests/validate-workflow-gates.py` enforces this, and a
# SKIPPED JOB LOOKS GREEN — read the ready run's jobs, never the rollup
# (docs/ship.md Step 6.3).
#
# `all-green` is the one check the ruleset requires. Matrix jobs report expanded
# names (`Integration (ubuntu-24.04, git 2.36.6)`), so requiring `Integration`
# would never report.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Read-only by default; a job that needs more says so and why.
permissions:
  contents: read # checkout; nothing in this workflow writes to the repository

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate PR commits follow conventional format
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -e
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          FAILED=0
          # The PR title becomes the squash commit, and svu reads it to cut the
          # next version, so it must be a valid subject too.
          if ! printf '%s' "$TITLE" | grep -qE "$PATTERN"; then
            echo "❌ PR title: $TITLE"
            FAILED=1
          else
            echo "✅ PR title: $TITLE"
          fi
          while IFS= read -r sha; do
            MSG=$(git log --format='%s' -1 "$sha")
            if ! printf '%s' "$MSG" | grep -qE "$PATTERN"; then
              echo "❌ $sha: $MSG"
              FAILED=1
            else
              echo "✅ $sha: $MSG"
            fi
          done < <(git rev-list "$BASE".."$HEAD")
          if [ "$FAILED" -eq 1 ]; then
            echo
            echo "Expected: type(scope)?!?: description"
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi

  # Every PR must come through the ship workflow (docs/ship.md). It requires a
  # `Ship-Stamp:` git trailer on the pull request's HEAD commit and re-derives the
  # value with the helper taken from the PR's BASE commit, so a branch cannot
  # neuter it and self-certify. Do not convert this job to `pull_request_target`:
  # it executes a script from the checkout, which is harmless with a fork's
  # read-only token and arbitrary code with the repository's own token otherwise.
  ship:
    name: Ship Workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Selftest the gate
        run: bash tests/validate-ship-stamp.sh --selftest
      - name: Verify the PR came through the ship workflow
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash tests/validate-ship-stamp.sh

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: |
          go vet ./...
          # the fault-injection build (scenario 7) is a different set of files
          go vet -tags faultinject ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      # v1.1.4 panics under Go 1.27 (found on the first CI run); bump deliberately.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: shellcheck
        run: |
          # By shebang, so a new script cannot silently go unlinted: sh scripts
          # are checked as POSIX sh (install.sh is the one users pipe into sh),
          # bash scripts as bash. The hook shim is generated Go text, tested
          # through the hooks tests.
          for f in install.sh scripts/ci/*.sh scripts/dev/*.sh scripts/release/*.sh scripts/demo.sh tests/*.sh; do
            case $(head -1 "$f") in
              *bash*) shellcheck -S warning -s bash "$f" ;;
              *) shellcheck -s sh "$f" ;;
            esac
          done
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Workflows do not run on draft PRs
        run: |
          pip install --require-hashes --only-binary ':all:' -r scripts/ci/pyyaml-requirements.txt
          python3 tests/validate-workflow-gates.py --selftest
          python3 tests/validate-workflow-gates.py
      - name: goreleaser check
        run: |
          go run github.com/goreleaser/goreleaser/v2@v2.18.2 check

  # The workflows themselves: zizmor audits them for the mistakes that turn a CI job into a way
  # in (credentials left in the checkout, template injection, over-broad permissions, secrets
  # outside an environment, unpinned or impostor actions). Pinned by hash, run with the job's
  # read-only token so its online audits (known-vulnerable actions, impostor commits) work.
  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install zizmor
        run: pip install --require-hashes --only-binary ':all:' -r scripts/ci/zizmor-requirements.txt
      # Online on a pull request (known-vulnerable actions, impostor commits). On a push to main
      # it runs offline: this job gates the release, and an API hiccup or a new advisory against
      # an action that is already pinned must not block it.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          offline=""
          [ "$EVENT" = pull_request ] || offline="--offline"
          zizmor $offline --persona auditor --min-severity low --format plain .github/workflows

  # A new version waits seven days (docs/security.md): every pinned version (go.mod, action SHAs,
  # tools run with `go run x@v`, pip pins, the minisign downloads) must be at least seven days
  # old, or named in .github/fresh-deps.txt with the reason. A registry that cannot be reached
  # is a warning, never a failure, so this cannot block a release on a network hiccup.
  dependency-age:
    name: Dependency age
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Selftest
        run: python3 scripts/ci/dep-age.py --selftest
      - name: Every pinned version is old enough
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/dep-age.py

  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race -short ./...

  # Which git/OS legs run. Linux is cheap, so every Linux leg runs on PRs; macOS
  # minutes count about 10x against a private repo's quota, so a PR gets only
  # Apple git on macos-latest and the rest runs on push to main (and in
  # release.yml).
  plan:
    name: Plan test matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
        run: |
          linux='{"os":"ubuntu-24.04","git":"2.36.6"},{"os":"ubuntu-24.04","git":"latest"},{"os":"ubuntu-24.04-arm","git":"latest"}'
          mac='{"os":"macos-latest","git":"apple"}'
          full='{"os":"macos-latest","git":"brew"},{"os":"macos-15-intel","git":"apple"}'
          if [ "$EVENT" = push ]; then
            echo "matrix={\"include\":[$linux,$mac,$full]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$linux,$mac]}" >> "$GITHUB_OUTPUT"
          fi

  # Integration (real git in temp dirs) and e2e (testscript, which re-executes
  # the test binary as `outfit`) in ONE job: the whole suite, including what
  # `go test -short` skips in the unit job.
  integration:
    name: Integration (${{ matrix.os }}, git ${{ matrix.git }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: plan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Restore the git build cache
        id: gitcache
        if: matrix.git != 'apple' && matrix.git != 'brew'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/outfit-git
          key: git-${{ runner.os }}-${{ runner.arch }}-${{ matrix.git }}-${{ hashFiles('scripts/ci/install-git.sh') }}
      - name: Install the git under test
        env:
          GIT_UNDER_TEST: ${{ matrix.git }}
        run: scripts/ci/install-git.sh "$GIT_UNDER_TEST"
      # Saved right after the build, not at job end, so a failing test leg does
      # not throw away several minutes of compiling git.
      - name: Save the git build cache
        if: steps.gitcache.outputs.cache-hit == 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/outfit-git
          key: ${{ steps.gitcache.outputs.cache-primary-key }}
      - name: go test (integration and e2e)
        run: go test -race -count=1 ./...

  # install.sh against a fake local release (the public and the API layout, a
  # pinned version, a bad checksum, an unsupported platform, a hostile archive,
  # good and bad signatures), the contract between install.sh, its docs and the
  # committed keys, and publish.sh against a stub gh.
  install:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-24.04","macos-latest"]' || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minisign
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install minisign; else sudo apt-get update -qq && sudo apt-get install -y -qq minisign; fi
      - name: install.sh tests
        run: REQUIRE_MINISIGN=1 INSTALL_TEST_NETWORK=1 bash tests/install-test.sh
      - name: install.sh contract
        run: bash tests/validate-install-contract.sh
      - name: publish.sh tests
        if: runner.os == 'Linux'
        run: bash tests/publish-test.sh

  # The scripted walkthrough, run with a freshly built binary.
  demo:
    name: Demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-24.04","macos-latest"]' || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/outfit" ./cmd/outfit
      - run: scripts/demo.sh --quick --outfit "$RUNNER_TEMP/outfit"

  # The macOS signing path, exercised on every PR with a throwaway certificate:
  # the release's own GoReleaser snapshot and signing hook must sign BOTH slices of
  # the universal binary, and the signed binary must run. (A real Developer ID
  # chain is what macOS judged in the first release attempt; a throwaway certificate
  # cannot reproduce that, so the release's smoke legs stay the guard for it.) One
  # short macOS job; AGENTS.md has the cost note.
  signing:
    name: Signing smoke
    runs-on: macos-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install goreleaser and minisign
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.18.2
          go install aead.dev/minisign/cmd/minisign@v0.3.0
      - run: scripts/ci/signing-smoke.sh

  # Every fuzz target for 20 s (docs/testing.md). The seed corpora already run in `unit`;
  # this looks for NEW inputs, which differ from run to run: a crash it finds in old code
  # must not block an unrelated pull request, so the job is NOT in all-green's needs (a red
  # job is still a red workflow, and the merge policy reads every job). The failing input is
  # uploaded as an artifact: commit it under testdata/fuzz/<Target>/ and it is a test.
  fuzz:
    name: Fuzz (20 s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: scripts/dev/fuzz.sh 20
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failing-input
          path: internal/**/testdata/fuzz/**
          if-no-files-found: warn

  # The SOFT performance gate (docs/HANDOVER.md §7.6): `outfit sync` within 10 ms of
  # `git rev-parse --git-dir`, by hyperfine, Linux only. Not in all-green's needs and
  # continue-on-error: a noisy runner is a reason to look, never a reason to block. The
  # hard gate (git processes per command) is in the scenarios, on every OS.
  perf:
    name: Performance (soft)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install hyperfine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq hyperfine jq
      - run: scripts/ci/perf-soft.sh

  # The single required check. Fails unless every needed job SUCCEEDED. The
  # `commits` and `ship` jobs only exist on pull requests, so on a push to main
  # they are expected to be skipped; nothing else may be.
  all-green:
    name: all-green
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [commits, ship, lint, workflows, dependency-age, unit, plan, integration, install, demo, signing]
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always()
    steps:
      - name: Every needed job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$EVENT" = "pull_request" ]; then
            filter='[to_entries[] | select(.value.result != "success")] | length'
          else
            filter='[to_entries[] | select(.value.result != "success" and (.key != "commits" and .key != "ship" or .value.result != "skipped"))] | length'
          fi
          bad=$(echo "$NEEDS" | jq "$filter")
          if [ "$bad" != "0" ]; then echo "❌ $bad job(s) did not succeed"; exit 1; fi
          echo "✅ all needed jobs succeeded"
